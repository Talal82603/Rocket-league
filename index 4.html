<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rocket Car Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Arial,sans-serif;color:white}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:32px;font-weight:900;background:#0008;padding:7px 20px;border-radius:14px}
#hint{position:absolute;left:16px;bottom:16px;background:#0009;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5}
#cam{position:absolute;right:16px;top:16px;background:#0009;padding:9px 13px;border-radius:12px;font-weight:800}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;pointer-events:auto}
.panel{background:#101c2e;border:1px solid #ffffff25;border-radius:20px;padding:28px;text-align:center;box-shadow:0 20px 80px #000}
button{font-size:18px;font-weight:800;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;background:#fff;color:#111}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="score">0 : 0</div>
  <div id="cam">BALL CAM: OFF</div>
  <div id="hint">WASD / arrows = drive · Space = boost · Shift = jump · C = ball cam · R = reset</div>
</div>
<div id="start"><div class="panel"><h1>ROCKET CAR ARENA</h1><p>Rocket-car football with ball cam.</p><button id="play">PLAY</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let W,H,dpr; function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();

const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();
 if(e.key.toLowerCase()==='c'){ballCam=!ballCam;document.getElementById('cam').textContent='BALL CAM: '+(ballCam?'ON':'OFF')}
 if(e.key.toLowerCase()==='r')reset()
}); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let ballCam=false, running=false, blue=0,orange=0;
const field={w:1800,h:1000};
let car,ball;
function reset(){car={x:field.w*.25,y:field.h/2,a:0,vx:0,vy:0,boost:100,onGround:true};ball={x:field.w/2,y:field.h/2,vx:0,vy:0,r:28}}
function play(){running=true;document.getElementById('start').style.display='none';reset()}
document.getElementById('play').onclick=play;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){
 if(!running)return;
 let f=0, steer=0;
 if(keys.w||keys.arrowup)f=1;if(keys.s||keys.arrowdown)f=-.65;
 if(keys.a||keys.arrowleft)steer=-1;if(keys.d||keys.arrowright)steer=1;
 const speed=Math.hypot(car.vx,car.vy);
 if(speed>.3)car.a+=steer*2.7*dt*(.35+clamp(speed/550,0,1));
 const boost=keys[' ']&&car.boost>0&&f>=0;
 let accel=480*(boost?2.0:1);
 if(boost){car.boost-=38*dt}else car.boost=Math.min(100,car.boost+8*dt);
 car.vx+=Math.cos(car.a)*f*accel*dt;car.vy+=Math.sin(car.a)*f*accel*dt;
 car.vx*=Math.pow(.12,dt);car.vy*=Math.pow(.12,dt);
 if((keys.shift||keys['shift'])&&car.onGround){car.vx+=Math.cos(car.a)*160;car.vy+=Math.sin(car.a)*160;car.onGround=false}
 car.x+=car.vx*dt;car.y+=car.vy*dt;
 car.x=clamp(car.x,70,field.w-70);car.y=clamp(car.y,70,field.h-70);
 if(!keys.shift)car.onGround=true;

 ball.vx*=Math.pow(.28,dt);ball.vy*=Math.pow(.28,dt);
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 if(ball.y<40||ball.y>field.h-40){ball.y=clamp(ball.y,40,field.h-40);ball.vy*=-.82}
 // side walls
 if(ball.x<35||ball.x>field.w-35){ball.x=clamp(ball.x,35,field.w-35);ball.vx*=-.82}
 const dx=ball.x-car.x,dy=ball.y-car.y,d=Math.hypot(dx,dy);
 if(d<ball.r+34){
   const nx=dx/(d||1),ny=dy/(d||1),push=Math.max(0,ball.r+34-d);
   ball.x+=nx*push;ball.y+=ny*push;
   const hit=420+speed*.7+(boost?260:0);
   ball.vx=nx*hit+car.vx*.55;ball.vy=ny*hit+car.vy*.55;
 }
 // goals
 if(ball.x<0){orange++;document.getElementById('score').textContent=blue+' : '+orange;reset()}
 if(ball.x>field.w){blue++;document.getElementById('score').textContent=blue+' : '+orange;reset()}
}

function draw(){
 x.clearRect(0,0,W,H);
 const target=ballCam?ball:car;
 const scale=Math.min(W/1100,H/700);
 const camX=clamp(target.x-field.w/2/1.4,0,field.w-W/scale);
 const camY=clamp(target.y-field.h/2/1.4,0,field.h-H/scale);
 x.save();x.scale(scale,scale);x.translate(-camX,-camY);
 // sky/field
 x.fillStyle='#10243a';x.fillRect(0,0,field.w,field.h);
 x.fillStyle='#176b48';x.fillRect(35,35,field.w-70,field.h-70);
 x.strokeStyle='#ffffffaa';x.lineWidth=6;x.strokeRect(35,35,field.w-70,field.h-70);
 x.beginPath();x.moveTo(field.w/2,35);x.lineTo(field.w/2,field.h-35);x.stroke();
 x.beginPath();x.arc(field.w/2,field.h/2,125,0,Math.PI*2);x.stroke();
 // goals
 x.fillStyle='#315dff55';x.fillRect(-5,field.h/2-150,70,300);
 x.fillStyle='#ff5b4555';x.fillRect(field.w-65,field.h/2-150,70,300);
 // boost pads
 for(let i=0;i<8;i++){let px=180+i*205,py=i%2?180:field.h-180;x.beginPath();x.arc(px,py,18,0,7);x.fillStyle='#ffd84a';x.fill()}
 // ball
 x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fillStyle='#eee';x.fill();x.strokeStyle='#222';x.lineWidth=5;x.stroke();
 // car
 x.save();x.translate(car.x,car.y);x.rotate(car.a);
 x.fillStyle='#26a7ff';x.fillRect(-42,-25,84,50);x.fillStyle='#173b67';x.fillRect(-10,-18,35,36);
 x.fillStyle='#111';x.fillRect(-28,-31,18,10);x.fillRect(15,-31,18,10);x.fillRect(-28,21,18,10);x.fillRect(15,21,18,10);
 if(keys[' ']){x.fillStyle='#ffb52e';x.beginPath();x.moveTo(-48,0);x.lineTo(-82,-12);x.lineTo(-65,0);x.lineTo(-82,12);x.fill()}
 x.restore();
 x.restore();
}
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)} reset();loop(last);
</script>
</body>
</html>
