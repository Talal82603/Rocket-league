const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),app=document.getElementById('app');
function render(){let q=search.value.toLowerCase();let a=TOOLS.filter(x=>x[2].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));grid.innerHTML=a.map(x=>`<button class="card" onclick="openTool(${x[0]})"><b>${x[2]}</b><small>${x[1]}</small></button>`).join('');count.textContent=a.length+' tools shown • 1,000 total';}
function openTool(id){let x=TOOLS.find(t=>t[0]===id);app.style.display='block';app.innerHTML=`<button class="action" onclick="app.style.display='none'">← Back</button><h2>${x[2]}</h2><p>This is your ${x[1].toLowerCase()} workspace.</p><textarea id="input" placeholder="Enter text or data here..."></textarea><button class="action" onclick="runTool('${x[2].replace(/'/g,"\\'")}')">Run Tool</button><div class="out" id="out">Ready.</div>`;scrollTo({top:0,behavior:'smooth'});}
function runTool(name){let v=document.getElementById('input').value,o=document.getElementById('out');
if(name==='Calculator'){try{o.textContent=Function('return '+v)()}catch{o.textContent='Invalid calculation'};return}
if(name==='Word Counter'){o.textContent=(v.trim()?v.trim().split(/\s+/).length:0)+' words • '+v.length+' characters';return}
if(name==='Uppercase'){o.textContent=v.toUpperCase();return}
if(name==='Lowercase'){o.textContent=v.toLowerCase();return}
if(name==='Reverse Text'){o.textContent=[...v].reverse().join('');return}
if(name==='Password Generator'){let a='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';o.textContent=Array.from({length:18},()=>a[Math.random()*a.length|0]).join('');return}
o.textContent='Tool result generated for: '+name+'\n\nInput:\n'+v;}
search.addEventListener('input',render);render();
