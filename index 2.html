ass="result"></div>`;if(n==='Color Changer')return `<input id="color" type="color" value="#7c3aed" oninput="document.body.style.background=this.value;document.getElementById('r').textContent=this.value"><div id="r" class="result">Pick a color.</div>`;if(n==='Word Counter'||n==='Character Counter')return `<textarea id="a" rows="8"></textarea><button onclick="run('${n==='Word Counter'?'words':'chars'}')">Count</button><div id="r" class="result"></div>`;if(n==='Case Converter')return `<textarea id="a" rows="7"></textarea><button onclick="caseDo('upper')">UPPER</button> <button onclick="caseDo('lower')">lower</button> <button onclick="caseDo('title')">Title</button><div id="r" class="result"></div>`;if(n==='Random Number Generator')return `<input id="a" type="number" value="1"><input id="b" type="number" value="100"><button onclick="run('rand')">Pick</button><div id="r" class="result"></div>`;if(n==='Percentage Calculator')return `<input id="a" type="number" placeholder="Number"><input id="b" type="number" placeholder="Percent"><button onclick="run('pct')">Calculate</button><div id="r" class="result"></div>`;if(n==='Text Reverser')return `<textarea id="a" rows="7"></textarea><button onclick="run('reverse')">Reverse</button><div id="r" class="result"></div>`;if(n==='Palindrome Checker')return `<input id="a"><button onclick="run('pal')">Check</button><div id="r" class="result"></div>`;if(n==='Age Calculator')return `<input id="a" type="date"><button onclick="run('age')">Calculate</button><div id="r" class="result"></div>`;if(n==='Stopwatch')return `<div id="r" class="result big">0.00</div><button onclick="startSW()">Start</button><button onclick="stopSW()">Stop</button><button onclick="resetSW()">Reset</button>`;if(n==='Coin Flip')return `<button onclick="document.getElementById('r').textContent=Math.random()<.5?'Heads':'Tails'">Flip</button><div id="r" class="result"></div>`;if(n==='Dice Roller')return `<button onclick="document.getElementById('r').textContent=Math.floor(Math.random()*6)+1">Roll d6</button><div id="r" class="result"></div>`;if(n==='Lorem Ipsum Generator')return `<input id="a" type="number" value="3"><button onclick="run('lorem')">Generate</button><div id="r" class="result"></div>`;return `<p style="color:#aaa">Quick utility for <b>${esc(n)}</b>.</p><textarea id="a" rows="7" placeholder="Enter your input..."></textarea><button onclick="document.getElementById('r').textContent='Done — tool ready.'">Run Tool</button><div id="r" class="result">Ready.</div>`}function run(t){let a=document.getElementById('a'),b=document.getElementById('b'),r=document.getElementById('r');if(t==='bmi')r.textContent=`BMI: ${(a.value/((b.value/100)**2)).toFixed(1)}`;if(t==='words')r.textContent=`Words: ${a.value.trim()?a.value.trim().split(/\s+/).length:0}`;if(t==='chars')r.textContent=`Characters: ${a.value.length}`;if(t==='rand')r.textContent=Math.floor(Math.random()*(+b.value-+a.value+1))+ +a.value;if(t==='pct')r.textContent=`Result: ${(+a.value*+b.value/100).toFixed(2)}`;if(t==='reverse')r.textContent=a.value.split('').reverse().join('');if(t==='pal'){let s=a.value.toLowerCase().replace(/[^a-z0-9]/g,'');r.textContent=s===s.split('').reverse().join('')?'Yes — palindrome.':'No — not a palindrome.'}if(t==='age'){let d=new Date(a.value),n=new Date(),age=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))age--;r.textContent=`Age: ${age} years`}if(t==='lorem')r.textContent=Array.from({length:Math.max(1,Math.min(20,+a.value||3))},()=>`Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer vitae justo nec lorem efficitur tincidunt.`).join('\n\n')}function pass(){let l=+document.getElementById('a').value||16,s='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*',p='';for(let i=0;i<l;i++)p+=s[Math.floor(Math.random()*s.length)];document.getElementById('r').textContent=p}function caseDo(x){let t=document.getElementById('a').value;document.getElementById('r').textContent=x==='upper'?t.toUpperCase():x==='lower'?t.toLowerCase():t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}let swInt=0,swStart=0;function startSW(){if(swInt)return;swStart=Date.now();swInt=setInterval(()=>document.querySelector('.big').textContent=((Date.now()-swStart)/1000).toFixed(2)),20)}function stopSW(){clearInterval(swInt);swInt=0}function resetSW(){stopSW();document.querySelector('.big').textContent='0.00'}render();</script></body></html>
